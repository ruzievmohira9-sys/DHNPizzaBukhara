@keyframes mv{to{background-position:0 0,460px 380px}}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 5%;background:rgba(15,0,0,.85);backdrop-filter:blur(8px);border-bottom:1px solid #ff8a0055}
header img{height:48px;filter:drop-shadow(0 0 10px #ff4d00)}header b{font-size:20px;background:linear-gradient(90deg,var(--y),var(--r));-webkit-background-clip:text;color:transparent}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}nav a,button{cursor:pointer;font:inherit}
nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:20px;font-size:14px}nav a:hover{background:#ffffff22}
.cb{background:linear-gradient(90deg,var(--o),var(--r));border:0;color:#fff;padding:9px 16px;border-radius:22px;font-weight:700;box-shadow:0 0 16px #ff4d0088}
.hero{text-align:center;padding:70px 5% 30px}.hero img{width:170px;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 30px #ff4d00)}
@keyframes fl{50%{transform:translateY(-12px) rotate(-3deg)}}.hero h1{font-size:clamp(30px,6vw,56px);margin:10px 0}.hero p{color:#ffd9a0}
section{padding:30px 5%;max-width:1200px;margin:auto}h2{font-size:28px;margin-bottom:16px;color:var(--y)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:#ffffff14;border:1px solid #ffffff33;color:#fff;padding:9px 16px;border-radius:22px}.tabs .on{background:linear-gradient(90deg,var(--o),var(--r));border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:#1c0a0acc;border:1px solid #ff8a0044;border-radius:16px;overflow:hidden;transition:.3s}.card:hover{transform:translateY(-6px);box-shadow:0 10px 30px #ff4d0066}
.im{position:relative;aspect-ratio:16/9;overflow:hidden;cursor:pointer;background:#2a0d0d}.im img{width:100%;height:100%;object-fit:cover;transition:.5s}.card:hover .im img{transform:scale(1.1)}
.ph{height:100%;display:grid;place-items:center;font-size:60px;background:linear-gradient(135deg,#ff8a0044,#e11d0c44)}
.ov{position:absolute;inset:0;background:rgba(10,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:.3s;text-align:center;padding:10px}
.card:hover .ov,.card.on .ov{opacity:1}.ov h3{font-size:22px}.ov button{background:linear-gradient(90deg,var(--y),var(--o));border:0;padding:10px 20px;border-radius:22px;font-weight:800;color:#400}
.inf{padding:12px 14px}.inf small{color:#ffcf99;display:block}.inf b{color:var(--y)}
.side{position:fixed;top:0;right:-100%;width:min(440px,100%);height:100%;background:#180606;z-index:20;transition:.35s;overflow:auto;padding:18px;border-left:2px solid var(--o)}.side.open{right:0}
.side input,.side select{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #ff8a0066;background:#2a0f0f;color:#fff;font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff22}
.q button{width:28px;height:28px;border-radius:50%;border:0;background:var(--o);font-weight:800}
.x{float:right;background:0;border:0;color:#fff;font-size:26px}
.ord{background:#ffffff10;border-radius:12px;padding:12px;margin:10px 0}.steps{display:flex;gap:4px;margin:10px 0}.steps i{flex:1;text-align:center;font-style:normal;font-size:11px;padding:6px 2px;border-radius:8px;background:#ffffff18}.steps i.d{background:linear-gradient(90deg,var(--o),var(--r))}
.stars span{font-size:30px;cursor:pointer;color:#666}.stars .f{color:var(--y)}
.news .card .inf p{font-size:14px;color:#ffe;margin-top:6px}
footer{text-align:center;padding:30px;color:#ffcf99}

<script>const K={p:'dhn_products',o:'dhn_orders',n:'dhn_news'};
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('Xotira to\'ldi: rasm hajmi katta');return false}};
const ST=['Rasmiylashtirildi','Tayyorlanmoqda',"Yo'lda",'Yetkazildi'];
const CATS={sushi:['🍣','Sushi'],pitsa:['🍕','Pitsa'],lavash:['🌯','Lavash'],tovuq:['🍗','Tovuq / KFC']};
const money=n=>Number(n).toLocaleString('ru')+" so'm";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const media=p=>p.img?`<img src="${p.img}" alt="">`:`<div class="ph">${CATS[p.c]?CATS[p.c][0]:'🍽️'}</div>`;
if(!get(K.p)){set(K.p,[
{id:1,c:'pitsa',n:'Pepperoni',d:'Pepperoni, mozzarella, pomidor sousi',price:65000,sz:'30 sm'},
{id:2,c:'pitsa',n:'Margarita',d:'Mozzarella, pomidor, rayhon',price:55000,sz:'30 sm'},
{id:3,c:'pitsa',n:'Katta pitsa 40 sm',d:'Go\'sht, qo\'ziqorin, pishloq',price:95000,sz:'40 sm'},
{id:4,c:'sushi',n:'Filadelfiya',d:'Losos, qaymoqli pishloq, guruch',price:70000,sz:'8 dona'},
{id:5,c:'sushi',n:'Kaliforniya',d:'Krab, avokado, ikra',price:60000,sz:'8 dona'},
{id:6,c:'lavash',n:'Lavash',d:'Mol go\'shti, sabzavot, sous',price:32000,sz:'Oddiy'},
{id:7,c:'lavash',n:'Katta lavash',d:'Qo\'sh go\'sht, pishloq, sous',price:45000,sz:'Katta'},
{id:8,c:'tovuq',n:'Qovurilgan tovuq',d:'Qarsildoq tovuq, 8 bo\'lak',price:80000,sz:'8 bo\'lak'},
{id:9,c:'tovuq',n:'Kefsi',d:'Tovuq qanotlari va kartoshka fri',price:48000,sz:'Set'}]);}
if(!get(K.n)){set(K.n,[
{id:1,t:'Ochilish aksiyasi!',x:'Birinchi buyurtmaga 20% chegirma. DHNPizzaBukhara endi Buxoroda!',img:null},
{id:2,t:'Yangi menyu: Sushi',x:'Yangi sushi rollar to\'plami bilan tanishing.',img:null}]);}

<script>
let cat='all',cart=get('dhn_cart',{});const my=()=>get('dhn_my',[]);
function render(){const P=get(K.p,[]);
tabs.innerHTML=`<button class="${cat=='all'?'on':''}" onclick="cat='all';render()">Hammasi</button>`+Object.entries(CATS).map(([k,v])=>`<button class="${cat==k?'on':''}" onclick="cat='${k}';render()">${v[0]} ${v[1]}</button>`).join('');
pg.innerHTML=P.filter(p=>cat=='all'||p.c==cat).map(p=>`<div class="card" onclick="this.classList.toggle('on')"><div class="im">${media(p)}<div class="ov"><h3>${esc(p.n)}</h3><button onclick="event.stopPropagation();add(${p.id});openCart()">Buyurtma berish</button></div></div><div class="inf"><b>${esc(p.n)}</b> • ${esc(p.sz)}<small>${esc(p.d)}</small><b>${money(p.price)}</b></div></div>`).join('')||'<p>Hozircha bo\'sh</p>';
ng.innerHTML=get(K.n,[]).map(n=>`<div class="card"><div class="im" onclick="this.parentNode.classList.toggle('on')">${n.img?`<img src="${n.img}">`:'<div class="ph">📰</div>'}<div class="ov"><h3>${esc(n.t)}</h3></div></div><div class="inf"><b>${esc(n.t)}</b><p>${esc(n.x)}</p></div></div>`).join('');
cnt()}
function cnt(){cc.textContent=Object.values(cart).reduce((a,b)=>a+b,0);set('dhn_cart',cart)}
function add(id){cart[id]=(cart[id]||0)+1;cnt();drawCart()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];cnt();drawCart()}
function cl(){cart_.classList.remove('open');ord.classList.remove('open')}
const cart_=document.getElementById('cart');
function openCart(){drawCart();cart_.classList.add('open');ord.classList.remove('open')}
function drawCart(){const P=get(K.p,[]);const it=Object.keys(cart).map(i=>P.find(p=>p.id==i)&&{p:P.find(p=>p.id==i),q:cart[i]}).filter(Boolean);
const tot=it.reduce((a,x)=>a+x.p.price*x.q,0);
ci.innerHTML=it.map(x=>`<div class="row"><span>${esc(x.p.n)}<br><small>${money(x.p.price)}</small></span><span class="q"><button onclick="chg(${x.p.id},-1)">−</button> ${x.q} <button onclick="chg(${x.p.id},1)">+</button></span></div>`).join('')||'<p>Savat bo\'sh</p>';
cf.innerHTML=it.length?`<h3 style="margin:12px 0">Jami: ${money(tot)}</h3><input id="fn" placeholder="Ismingiz"><input id="fp" placeholder="Telefon raqam" type="tel"><input id="fa" placeholder="Manzil"><select id="fy" onchange="fc.style.display=this.value=='karta'?'block':'none'"><option value="naqd">Naqd pul</option><option value="karta">Karta</option></select><input id="fc" placeholder="Karta raqami" inputmode="numeric" maxlength="19" style="display:none"><button class="cb" style="width:100%;margin-top:8px" onclick="send()">Buyurtma berish</button>`:''}
async function send(){const n=fn.value.trim(),p=fp.value.trim(),a=fa.value.trim();if(!n||p.length<7||!a)return alert('Ism, telefon va manzilni to\'ldiring');
const y=fy.value,card=y=='karta'?'**** '+fc.value.replace(/\D/g,'').slice(-4):'';if(y=='karta'&&card.length<8)return alert('Karta raqamini kiriting');
const P=get(K.p,[]);const items=Object.keys(cart).map(i=>{const q=P.find(x=>x.id==i);return q&&{n:q.n,price:q.price,q:cart[i]}}).filter(Boolean);
const o={id:Date.now(),name:n,phone:p,addr:a,pay:y,card,items,total:items.reduce((s,x)=>s+x.price*x.q,0),st:0,rate:0,time:new Date().toLocaleString('ru')};
set(K.o,[o,...get(K.o,[])]);set('dhn_my',[o.id,...my()]);cart={};cnt();
try{fetch('https://formsubmit.co/ajax/dhnpizzabukhara@gmail.com',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:'Yangi buyurtma #'+o.id,Ism:n,Telefon:p,Manzil:a,Tolov:y+' '+card,Buyurtma:items.map(x=>x.n+' x'+x.q).join(', '),Jami:money(o.total)})})}catch(e){}
alert('✅ Buyurtmangiz qabul qilindi!');openOrd()}
function openOrd(){cart_.classList.remove('open');ord.classList.add('open');drawOrd()}
function drawOrd(){const O=get(K.o,[]).filter(o=>my().includes(o.id));
oi.innerHTML=O.map(o=>`<div class="ord"><b>#${String(o.id).slice(-6)}</b> • ${esc(o.time)}<br>${o.items.map(x=>esc(x.n)+' ×'+x.q).join(', ')}<br><b>${money(o.total)}</b><div class="steps">${ST.map((s,i)=>`<i class="${i<=o.st?'d':''}">${s}</i>`).join('')}</div>${o.st==3?`<div class="stars">${[1,2,3,4,5].map(i=>`<span class="${i<=o.rate?'f':''}" onclick="rate(${o.id},${i})">★</span>`).join('')}</div>`:''}</div>`).join('')||'<p>Buyurtmalar yo\'q</p>'}
function rate(id,r){const O=get(K.o,[]);O.find(o=>o.id==id).rate=r;set(K.o,O);drawOrd()}
setInterval(()=>{if(ord.classList.contains('open'))drawOrd()},3000);render();
</script></body></html>
