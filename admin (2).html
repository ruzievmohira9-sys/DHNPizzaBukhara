function stt(id,s){const O=get(K.o,[]);O.find(o=>o.id==id).st=+s;set(K.o,O)}
function delO(id){if(confirm('O\'chirilsinmi?')){set(K.o,get(K.o,[]).filter(o=>o.id!=id));draw()}}
function prods(){return `<div class="c"><b>Mahsulot qo'shish</b><div class="g"><input id="pn" placeholder="Nomi"><input id="ps" placeholder="Hajmi (30 sm, Katta...)"><input id="pr" type="number" placeholder="Narx"><select id="pc">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v[1]}</option>`).join('')}</select></div><textarea id="pd" placeholder="Tavsif"></textarea><input type="file" accept="image/*" onchange="up(this,'p')"><button onclick="addP()">Qo'shish</button></div>`+get(K.p,[]).map(p=>`<div class="c r"><span>${p.img?`<img src="${p.img}"> `:CATS[p.c][0]} <b>${esc(p.n)}</b> • ${esc(p.sz)} • ${money(p.price)}</span><button onclick="delP(${p.id})">O'chirish</button></div>`).join('')}
function addP(){if(!pn.value||!pr.value)return alert('Nom va narx kerak');if(set(K.p,[...get(K.p,[]),{id:Date.now(),c:pc.value,n:pn.value,d:pd.value,price:+pr.value,sz:ps.value,img:pic.p||null}])){pic.p=null;draw()}}
function delP(id){if(confirm('O\'chirilsinmi?')){set(K.p,get(K.p,[]).filter(p=>p.id!=id));draw()}}
function news(){return `<div class="c"><b>Yangilik qo'shish</b><input id="nt" placeholder="Sarlavha"><textarea id="nx" placeholder="Matn"></textarea><input type="file" accept="image/*" onchange="up(this,'n')"><button onclick="addN()">Qo'shish</button></div>`+get(K.n,[]).map(n=>`<div class="c r"><span>${n.img?`<img src="${n.img}"> `:'📰 '}<b>${esc(n.t)}</b></span><button onclick="delN(${n.id})">O'chirish</button></div>`).join('')}
function addN(){if(!nt.value)return alert('Sarlavha kerak');if(set(K.n,[{id:Date.now(),t:nt.value,x:nx.value,img:pic.n||null},...get(K.n,[])])){pic.n=null;draw()}}
function delN(id){set(K.n,get(K.n,[]).filter(n=>n.id!=id));draw()}
function up(inp,k){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=640;c.height=360;const x=c.getContext('2d'),s=Math.max(640/im.width,360/im.height);x.drawImage(im,(640-im.width*s)/2,(360-im.height*s)/2,im.width*s,im.height*s);pic[k]=c.toDataURL('image/jpeg',.7)};im.src=URL.createObjectURL(f)}
window.addEventListener('storage',()=>{if(tab=='o'&&!document.activeElement.matches('input,select,textarea'))draw()});
setInterval(()=>{if(tab=='o'&&app.style.display=='block'&&!document.activeElement.matches('input,select,textarea'))draw()},4000);
</script></body></html>
